# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CI

on:
  # Run workflow on all branches
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  clang-format:
    name: ubuntu-24.04-clang-format
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
  
    - name: Show Ubuntu version
      run: lsb_release -a

    - name: Install LLVM/Clang on Ubuntu
      # Ubuntu 24.04 has installed Clang versions: 16.0.6, 17.0.6, 18.1.3
      # Clang 19 was used initially on local Ubuntu OS
      # Clang 22 is installed with MSVC2026
      uses: ./.github/actions/setup-llvm
      with:
        llvm-version: "22"

    - name: Get list of changed C/C++ files
      id: changed-files
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" == "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
        elif [ "${{ github.event_name }}" == "push" ]; then
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt
          elif git rev-parse "${{ github.sha }}^" >/dev/null 2>&1; then
            echo "Using parent of current commit"
            git diff --name-only "${{ github.sha }}^" "${{ github.sha }}" > changed.txt
          else
            echo "First commit, checking all files."
            git ls-tree --name-only -r "${{ github.sha }}" > changed.txt
          fi
        fi

        echo "Changed files:"
        cat changed.txt

        if grep -qx ".clang-format" changed.txt; then
          echo ".clang-format changed - checking all C/C++ files"
          find . -type f \( -name "*.cpp" -o -name "*.h" \) > files.txt
        else
          grep -E '\.(cpp|h)$' changed.txt > files.txt || true
        fi

        echo "Files to check:"
        cat files.txt || true

        if [ -s files.txt ]; then
          echo "has_files=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_files=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run clang-format check on changed files
      if: steps.changed-files.outputs.has_files == 'true'
      run: |
        if clang-format --dry-run --Werror $(cat files.txt); then
          echo "::notice::Formatting check passed."
        else
          echo "::error::Formatting check failed."
          echo "::error::Run clang-format on the affected files and commit the changes."
          exit 1
        fi

    - name: No changed files detected
      if: steps.changed-files.outputs.has_files == 'false'
      run: echo "::notice::No .cpp or .h files changed. Skipping formatting check."



  build:
    runs-on: ${{ matrix.os }}
    needs: clang-format

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Windows, Release, latest MSVC-Clang compiler on the default runner image>
      # 3. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 4. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-24.04, windows-2025]
        build_type: [Release]
        c_compiler: [gcc, clang, cl, clang-cl]
        include:
          - os: windows-2025
            c_compiler: cl
            cpp_compiler: cl
            generator: Ninja
          - os: windows-2025
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            generator: Ninja
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            generator: Ninja
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            generator: Ninja
        exclude:
          - os: windows-2025
            c_compiler: gcc
          - os: windows-2025
            c_compiler: clang
          - os: ubuntu-24.04
            c_compiler: cl
          - os: ubuntu-24.04
            c_compiler: clang-cl

    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
    - uses: actions/checkout@v7
  
    - name: Show Ubuntu version
      if: runner.os == 'Linux'
      run: lsb_release -a

    - name: Show Windows version
      if: runner.os == 'Windows'
      run: systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

    # Install dependencies
    - name: Install Python on Ubuntu
      if: runner.os == 'Linux'
      uses: actions/setup-python@v7
      with:
        python-version: '3.13.5'

    - name: Check Python version on Ubuntu
      if: runner.os == 'Linux'
      run: |
        python --version
        pip --version

    - name: Install gcovr 7 on Ubuntu
      if: runner.os == 'Linux'
      run: |
          python -m pip install gcovr==7.0
          gcovr --version

    - name: Set g++ 13.3 as default on Ubuntu
      # Ubuntu 24.04 has installed GNU C++ versions: 12.4.0, 13.3.0, 14.2.0
      # Set g++ 13.3 as default
      if: runner.os == 'Linux'  && matrix.c_compiler == 'gcc'
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 200
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 200
        sudo update-alternatives --set gcc /usr/bin/gcc-13
        sudo update-alternatives --set g++ /usr/bin/g++-13
        gcc --version

    - name: Install LLVM/Clang on Ubuntu
      # Ubuntu 24.04 has installed Clang versions: 16.0.6, 17.0.6, 18.1.3
      # Clang 19 was used initially on local Ubuntu OS
      # Clang 22 is installed with MSVC2026
      if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
      uses: ./.github/actions/setup-llvm
      with:
        llvm-version: "22"

    - name: Install LCOV on Ubuntu
      if: runner.os == 'Linux'
      run: |
        wget https://archive.ubuntu.com/ubuntu/pool/universe/l/lcov/lcov_2.0-4ubuntu2_all.deb
        sudo dpkg -i lcov_2.0-4ubuntu2_all.deb || true
        sudo apt-get -f install -y --no-install-recommends
        lcov --version

    - name: Setup MSVC toolchain
      if: runner.os == 'Windows'
      uses: ./.github/actions/setup-msvc

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        -G ${{ matrix.generator }}
        -DDOCS_ENABLED=OFF

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Generate coverage.info from gcc
      if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
      working-directory: ${{ github.workspace }}
      run: python ./coverage_report.py -c gcc -t gcovr -e tests --verbose

    - name: Generate coverage.info from clang
      if: runner.os == 'Linux' && matrix.cpp_compiler == 'clang++'
      working-directory: ${{ github.workspace }}
      run: python ./coverage_report.py -c clang -t lcov -e tests --verbose

    - name: Upload coverage reports to Codecov
      if: runner.os == 'Linux' && (matrix.cpp_compiler == 'clang++' || matrix.cpp_compiler == 'g++')
      uses: codecov/codecov-action@v6
      with:
        files: ${{ github.workspace }}/docs/coverage/coverage.info
        fail_ci_if_error: true



  ubuntu-clang-tidy:
    name: ubuntu-24.04-clang-tidy
    runs-on: ubuntu-24.04
    needs: build

    # run clang-tidy only in PR
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v7
  
    - name: Show Ubuntu version
      run: lsb_release -a

    - name: Install LLVM/Clang on Ubuntu
      # Ubuntu 24.04 has installed Clang versions: 16.0.6, 17.0.6, 18.1.3
      # Clang 19 was used initially on local Ubuntu OS
      # Clang 22 is installed with MSVC2026
      uses: ./.github/actions/setup-llvm
      with:
        llvm-version: "22"

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}
        -G Ninja
        -DENABLE_CLANG_TIDY=ON
        -DENABLE_CLANG_TIDY_STRICT=ON
        -DDOCS_ENABLED=OFF

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release



  windows-clang-tidy:
    name: windows-2025-clang-tidy
    runs-on: windows-2025
    needs: build

    # run clang-tidy only in PR
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v7
  
    - name: Show Windows version
      run: systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

    - name: Setup MSVC toolchain
      uses: ./.github/actions/setup-msvc

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=clang-cl
        -DCMAKE_C_COMPILER=clang-cl
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}
        -G Ninja
        -DENABLE_CLANG_TIDY=ON
        -DENABLE_CLANG_TIDY_STRICT=ON
        -DDOCS_ENABLED=OFF

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
